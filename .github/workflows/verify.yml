name: Verify N.E.K.O Plugin
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market_verify:
    uses: Project-N-E-K-O/N.E.K.O/.github/workflows/plugin-market-verify.yml@main
    with:
      plugin-id: dsh_hub
      neko-repository: Project-N-E-K-O/N.E.K.O
      neko-ref: main

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v3
      - name: Run smoke tests
        run: |
          uv venv
          uv run python -m unittest tests.test_smoke -v
